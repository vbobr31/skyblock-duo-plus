name: Build SkyblockDuoPlus
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Build plugin
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: SkyblockDuoPlus-1.12.2
          path: target/*.jar